data:
  train_csv: sample_data/train.csv
  test_csv: sample_data/test.csv
  label_map: sample_data/label_map.json
  text_column: text
  target_column: target

model:
  model_name: unsloth/Qwen2.5-1.5B-Instruct-bnb-4bit
  max_length: 256
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  gradient_checkpointing: unsloth
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  max_length: 128

training:
  output_dir: outputs/checkpoints
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  num_train_epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 50
  save_strategy: epoch
  save_total_limit: 2
  eval_max_samples: 1000
  seed: 42
